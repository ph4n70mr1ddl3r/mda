[package]
name = "mda-spike-leptos"
version = "0.0.0"
edition = "2021"
description = "Throwaway metadata-driven form renderer (Leptos/CSR) — Phase 0 spike (ADR-0009)."

# Standalone crate (NOT a workspace member): a WASM cdylib built by Trunk.
# The empty [workspace] table keeps it out of the parent Cargo workspace.
[workspace]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
