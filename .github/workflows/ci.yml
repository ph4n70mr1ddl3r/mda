name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mda
          POSTGRES_PASSWORD: mda
          POSTGRES_DB: mda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mda -d mda"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mda:mda@localhost:5432/mda
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: unit + doc tests (no DB needed)
        run: cargo test --lib --bins --doc

      - name: integration tests (against postgres service)
        run: cargo test --test integration
