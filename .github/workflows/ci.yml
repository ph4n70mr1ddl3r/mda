name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mda
          POSTGRES_PASSWORD: mda
          POSTGRES_DB: mda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mda -d mda"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # `mda` is the service superuser; the RLS migration creates the
      # non-superuser `mda_app` role, so the DB-backed tests actually exercise
      # RLS (superusers bypass it). SQLX_OFFLINE avoids any compile-time DB use.
      DATABASE_URL: postgres://mda:mda@localhost:5432/mda
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: unit + doc tests (no DB needed)
        run: cargo test --workspace --lib --bins && cargo test --workspace --doc

      # The DB-backed suites each get their own fresh database (tests/common/mod.rs),
      # so they are fully parallel-safe — no --test-threads=1 needed.
      - name: DB-backed tests (RLS, CRUD, publish, SSE, archive/restore, …)
        run: >-
          cargo test --test data --test studio --test integration --test events
          --test throttle --test sessions --test observability
          --test secrets --test templates --test notifications --test webhooks
          --test integration_flows --test graphql --test scheduler --test tenants
          --test mass_actions --test versioning --test translations --test admin

  # Build the Leptos WASM runtime UI with Trunk (catches UI regressions; the
  # backend job can't — the UI is a separate standalone workspace). Runs in
  # parallel; no DB needed.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to a concrete version that matches web/runtime-ui/Dockerfile,
      # so a WASM regression can't slip in from a Rust/Trunk version skew.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "web/runtime-ui"

      - name: Install trunk
        run: cargo install --locked --version 0.21.8 trunk

      - name: Build WASM UI
        working-directory: web/runtime-ui
        run: trunk build --release
