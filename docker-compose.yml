# Dev environment for MDA (PLAN §3 / Phase 0).
#
# Works with both Docker and Podman:
#   docker compose up -d postgres redis
#   podman compose up -d postgres redis     # Podman 4+ (named volumes are
#                                           # rootless-safe; no :Z needed)
# then run the server against them:
#   DATABASE_URL=postgres://mda:mda@127.0.0.1:5433/mda?sslmode=disable cargo run
# or build & run the app container:
#   docker compose --profile app up -d --build
#
# Staging (prod-like, json logs, restart policies, resource limits):
#   docker compose -f docker-compose.yml -f compose.staging.yml --profile app up -d
#
# Production via systemd + Quadlet: see deploy/quadlet/README.md

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mda
      # Dev default 'mda'; override for anything exposed beyond localhost.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mda}
      POSTGRES_DB: mda
    ports:
      - "5433:5432"
    volumes:
      - mda-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mda -d mda"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://mda:${POSTGRES_PASSWORD:-mda}@postgres:5432/mda
      # The app serves as the non-superuser mda_app role so biz.* RLS engages.
      # The role + grants are created at startup by migrations/...rls.sql; the
      # role password defaults to 'mda' — set MDA_APP_DB_PASSWORD to rotate it
      # (applied at startup) and keep the URL in sync.
      MDA_APP_DATABASE_URL: postgres://mda_app:${MDA_APP_DB_PASSWORD:-mda}@postgres:5432/mda
      MDA_APP_DB_PASSWORD: ${MDA_APP_DB_PASSWORD:-mda}
      # The image is a release build, which refuses to boot without a real
      # secret (≥ 32 bytes). Compose fails fast with this message if unset:
      # generate one with `openssl rand -hex 32` (e.g. in a gitignored .env).
      MDA_JWT_SECRET: ${MDA_JWT_SECRET:?MDA_JWT_SECRET is required for the app image — set it in .env (openssl rand -hex 32)}
      # Release builds refuse the known dev default bootstrap password.
      MDA_BOOTSTRAP_PASSWORD: ${MDA_BOOTSTRAP_PASSWORD:?MDA_BOOTSTRAP_PASSWORD is required for the app image — set it in .env (≥ 12 chars)}
      REDIS_URL: redis://redis:6379
      MDA_HOST: 0.0.0.0
      MDA_PORT: 8080
      LOG_FORMAT: json
      RUST_LOG: info,mda=debug,sqlx=warn
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mda-pgdata:
